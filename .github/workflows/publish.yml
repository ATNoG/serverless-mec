name: Publish multi-image Docker build to GHCR

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Avoid overlapping publishes from the same ref
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: its-live-capture
            context: ./
            file: ./Dockerfile
            image: ghcr.io/pmacoutinho/its-live-capture

          - name: mqtt-forwarder
            context: ./knativeServices/forwarder
            file: ./knativeServices/forwarder/Dockerfile
            image: ghcr.io/pmacoutinho/mqtt-forwarder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pmacoutinho
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # keep "latest" only on default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true

      - name: Inspect image manifest
        run: docker buildx imagetools inspect "${{ matrix.image }}:${{ github.ref_name }}"

      # Nice summary in the Actions UI with image, digest, and tags
      - name: Publish summary
        run: |
          {
            echo "### Published \`${{ matrix.name }}\`"
            echo ""
            echo "**Image:** \`${{ matrix.image }}\`"
            echo ""
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
