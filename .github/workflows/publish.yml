jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: its-live-capture
            context: ./sniffer
            file: ./sniffer/Dockerfile
            image: ghcr.io/pmacoutinho/its-live-capture
            platforms: linux/amd64,linux/arm64

          - name: mqtt-forwarder
            context: ./knativeServices/forwarder
            file: ./knativeServices/forwarder/Dockerfile
            image: ghcr.io/pmacoutinho/mqtt-forwarder
            platforms: linux/amd64,linux/arm64

          - name: serverless-mec-operator
            context: ./operator
            file: ./operator/Dockerfile
            image: ghcr.io/pmacoutinho/serverless-mec-operator
            # operator only needs amd64
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pmacoutinho
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # keep "latest" only on default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ matrix.platforms }}
          sbom: true
          provenance: true

      - name: Inspect image manifest
        run: docker buildx imagetools inspect "${{ matrix.image }}:${{ github.ref_name }}"

      - name: Select primary tag for checks
        id: picktag
        run: |
          first_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "tag=$first_tag" >> "$GITHUB_OUTPUT"

      # Only verify multi-arch when we actually built multiple platforms
      - name: Verify multi-arch (amd64 + arm64 present)
        if: contains(matrix.platforms, 'linux/arm64')
        run: |
          docker buildx imagetools inspect "${{ steps.picktag.outputs.tag }}" > inspect.txt
          echo "Inspecting: ${{ steps.picktag.outputs.tag }}"
          grep -q 'linux/amd64' inspect.txt || { echo "::error::linux/amd64 not present in manifest"; cat inspect.txt; exit 1; }
          grep -q 'linux/arm64' inspect.txt || { echo "::error::linux/arm64 not present in manifest"; cat inspect.txt; exit 1; }
          echo "linux/amd64 and linux/arm64 found."

      - name: Publish summary
        run: |
          {
            echo "### Published \`${{ matrix.name }}\`"
            echo ""
            echo "**Image:** \`${{ matrix.image }}\`"
            echo ""
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
