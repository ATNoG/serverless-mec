---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - eventing.knative.dev
  resources:
  - triggers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mec.atnog.org
  resources:
  - edgeapplicationhandoffs
  - edgeapplications
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mec.atnog.org
  resources:
  - edgeapplicationhandoffs/finalizers
  - edgeapplications/finalizers
  verbs:
  - update
- apiGroups:
  - mec.atnog.org
  resources:
  - edgeapplicationhandoffs/status
  - edgeapplications/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - serving.knative.dev
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
