apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: live-capture
  labels:
    app: live-capture
spec:
  selector:
    matchLabels:
      app: live-capture
  template:
    metadata:
      labels:
        app: live-capture
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
      containers:
        - name: user-container
          image: ghcr.io/pmacoutinho/its-live-capture-c:latest
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: IFACE
              value: "cw-mon-rxa"

            # Leave empty to use program defaults OR set your own BPF explicitly
            - name: BPF
              value: ""

            # libpcap version ignores DISPLAY_FILTER (kept for compatibility/logging)
            - name: DISPLAY_FILTER
              value: ""

            - name: LOG_EVERY
              value: "10"

            - name: CE_TYPE
              value: "its.cam"

            # Optional sink (same env name as before)
            # - name: K_SINK
            #   value: "http://your-sink.default.svc.cluster.local"

            - name: STDOUT_NDJSON
              value: "0"

            - name: PROMISCUOUS
              value: "1"

            - name: SEND_QUEUE_MAX
              value: "1000"

            - name: CE_INCLUDE_RAW_HEX
              value: "1"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - NET_RAW
                - NET_ADMIN
          volumeMounts:
            - name: varlog
              mountPath: /var/log
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      volumes:
        - name: varlog
          emptyDir: {}
