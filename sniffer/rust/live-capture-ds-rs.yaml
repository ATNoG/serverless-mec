apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: live-capture
  labels:
    app: live-capture
spec:
  selector:
    matchLabels:
      app: live-capture
  template:
    metadata:
      labels:
        app: live-capture
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
      containers:
        - name: user-container
          image: ghcr.io/pmacoutinho/its-live-capture-rs:latest
          imagePullPolicy: Always

          command: ["/bin/sh","-c"]
          args:
            - |
              set -eux
              echo "ARCH=$(uname -m)"
              echo "IFACE=$IFACE"

              echo "=== binary info ==="
              ls -lh /usr/local/bin/sniffer || true
              # Check whether the expected startup string exists in the binary
              if grep -a "its_live_capture starting up" /usr/local/bin/sniffer >/dev/null; then
                echo "binary_contains_startup_string=yes"
              else
                echo "binary_contains_startup_string=NO"
              fi

              echo "=== interface ==="
              ip link show "$IFACE" || true

              echo "=== tshark ==="
              which tshark || true
              tshark --version || true
              tshark -D || true

              echo "=== one-shot tshark (1 packet) ==="
              tshark -i "$IFACE" -n -l -T ek -c 1 || true
              echo "tshark_exit=$?"

              echo "=== running sniffer ==="
              /usr/local/bin/sniffer || true
              echo "sniffer_exit=$?"

              sleep 3600

          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: IFACE
              value: "cw-mon-rxa"
            - name: BPF
              value: ""
            - name: DISPLAY_FILTER
              value: ""
            - name: LOG_EVERY
              value: "10"
            - name: CE_TYPE
              value: "its.cam"
            - name: STDOUT_NDJSON
              value: "0"
            - name: PROMISCUOUS
              value: "1"
            - name: RUST_LOG
              value: "info"
            - name: CE_INCLUDE_RAW_HEX
              value: "1"

          securityContext:
            allowPrivilegeEscalation: true
            seccompProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add:
                - "NET_RAW"
                - "NET_ADMIN"
                - "SYS_ADMIN"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
