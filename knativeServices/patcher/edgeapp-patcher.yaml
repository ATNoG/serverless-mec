apiVersion: v1
kind: ServiceAccount
metadata:
  name: edgeapp-patcher-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edgeapp-patcher
  namespace: default
rules:
  # EdgeApplication CRD (your operator CR)
  - apiGroups: ["mec.atnog.org"]
    resources: ["edgeapplications"]
    verbs: ["get", "patch"]

  # Knative Service (serving.knative.dev Service)
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeapp-patcher
  namespace: default
subjects:
  - kind: ServiceAccount
    name: edgeapp-patcher-sa
    namespace: default
roleRef:
  kind: Role
  name: edgeapp-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: edgeapp-patcher
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
    spec:
      serviceAccountName: edgeapp-patcher-sa

      containers:
        - image: ghcr.io/pmacoutinho/edgeapp-patcher:latest
          imagePullPolicy: Always
          env:
            - name: VERIFY_TLS
              value: "true"
          ports:
            - containerPort: 8080
