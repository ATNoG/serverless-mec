apiVersion: mec.atnog.org/v1alpha1
kind: EdgeApplication
metadata:
  name: its-sniffer
  namespace: default
spec:
  dId: "its-sniffer"
  name: "its-sniffer"
  provider: "pmacoutinho"
  softVersion: "latest"
  dVersion: "1.0.0"
  infoName: "ITS Sniffer"
  description: "Per-node ITS sniffer that emits CloudEvents"

  service:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

    container:
      name: user-container
      image: ghcr.io/pmacoutinho/its-sniffer:latest

      env:
        - name: K_SINK
          value: "http://kafka-broker-ingress.knative-eventing.svc.cluster.local/default/default"
        - name: CE_INCLUDE_RAW_HEX
          value: "true"
        - name: SEND_QUEUE_MAX
          value: "1"
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW

    minScale: 1

    # No triggerFilters:
    # this is a background publisher, not an event subscriber.

  autoReplicas:
    - matchNodes:
        road-rsu: "true"
