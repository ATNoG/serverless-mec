# File: mec-mobileedgeapplications.yaml
apiVersion: mec.atnog.org/v1alpha1
kind: EdgeApplication
metadata:
  name: operator-test
  namespace: default
spec:
  # --- ETSI bits ---
  dId: "operator-test-appd-v1"
  name: "operator-test"
  provider: "example.mec"
  softVersion: "1.0.0"
  dVersion: "1.0.0"
  infoName: "CAM Event Logger"
  description: "Receives CAM CloudEvents and logs them."
  # --- Vendor-specific block ---
  service:
    container:
      image: gcr.io/knative-releases/knative.dev/eventing/cmd/event_display
      env:
        - name: LOG_FORMAT
          value: "pretty"
    triggerFilters:
      type: its.cam
