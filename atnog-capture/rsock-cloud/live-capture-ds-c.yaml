apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: live-capture-rsock
  labels:
    app: live-capture-rsock
spec:
  selector:
    matchLabels:
      app: live-capture-rsock
  template:
    metadata:
      labels:
        app: live-capture-rsock
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
      containers:
        - name: sniffer
          image: ghcr.io/pmacoutinho/its-live-capture-rsock:latest
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # capture interface
            - name: IFACE
              value: "eth0"

            # filter intent (we don’t execute full BPF; we implement the same *intent* fast)
            # default in code if empty:
            # (ether proto 0x8947 or (vlan and ether[16:2]==0x8947)) or udp port 2001
            - name: BPF
              value: ""

            - name: LOG_EVERY
              value: "10"
            - name: CE_TYPE
              value: "its.cam"
            - name: STDOUT_NDJSON
              value: "0"
            - name: PROMISCUOUS
              value: "1"
            - name: SEND_QUEUE_MAX
              value: "1000"

            # Optional: include raw frame hex in output/event data (big!)
            # - name: INCLUDE_RAW_HEX
            #   value: "1"

            # REQUIRED: where to POST CloudEvents (Knative Sink URL)
            - name: K_SINK
              value: "http://broker-ingress.knative-eventing.svc.cluster.local/YOUR_NAMESPACE/YOUR_BROKER"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - NET_RAW
                - NET_ADMIN   # helps for promiscuous mode; safe to keep
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
