# File: mecApp-crd.yaml
# ---------------------------------------------
# EdgeApplication (ETSI: EdgeApplication IOC)
# ---------------------------------------------
apiVersion: mec.atnog.org/v1alpha1
kind: EdgeApplication
metadata:
  name: cam-logger-operator
  namespace: default
spec:
  # --- ETSI-style descriptor fields ---
  dId: "cam-logger-appd-v1"
  name: "cam-logger"
  provider: "mec.example"
  softVersion: "1.0.0"
  dVersion: "1.0.0"
  infoName: "CAM Event Logger"
  description: "Receives CAM CloudEvents from the MEC platform and logs them."
  instanceId: "cam-logger-instance-001"

  # References to other MEC rules (optional)
  usedTrafficRules:
    - name: cam-logger-n6-ingress
      namespace: default
  usedDNSRules:
    - name: cam-logger-domain
      namespace: default

  relatedMepServices:
    - knative-kafka-broker.default
  relatedMeaServices:
    - mqtt-forwarder

  # --- Vendor-specific Knative block (your extension) ---
  service:
    container:
      image: ghcr.io/pmacoutinho/cam-logger:1.0.0
      env:
        - name: LOG_LEVEL
          value: "info"
        - name: APP_MODE
          value: "production"
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    # Simple hard scheduling: only on edge nodes with this label
    nodeSelector:
      mec.atnog.org/node-role: edge
      kubernetes.io/arch: amd64

    # More expressive node affinity
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: mec.atnog.org/zone
                operator: In
                values: ["edge-zone-1"]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: mec.atnog.org/gpu
                operator: In
                values: ["false"]
        - weight: 20
          preference:
            matchExpressions:
              - key: mec.atnog.org/high-mem
                operator: In
                values: ["true"]

    # CloudEvent filter for the Knative Trigger
    triggerFilters:
      type: "its.cam"
      source: "urn:dev:mqtt:cam"
      "mec.app": "cam-logger"
