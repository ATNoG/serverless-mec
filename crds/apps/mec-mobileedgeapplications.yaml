# File: mec-mobileedgeapplications.yaml
apiVersion: mec.etsi.org/v1alpha1
kind: MobileEdgeApplication
metadata:
  name: cam-logger
  namespace: default
spec:
  # --- ETSI bits ---
  appDId: "cam-logger-appd-v1"
  appName: "cam-logger"
  appProvider: "example.mec"
  appSoftVersion: "1.0.0"
  appDVersion: "1.0.0"
  appInfoName: "CAM Event Logger"
  appDescription: "Receives CAM CloudEvents and logs them."
  # --- Vendor-specific block ---
  service:
    container:
      image: gcr.io/knative-releases/knative.dev/eventing/cmd/event_display
      env:
        - name: LOG_FORMAT
          value: "pretty"
    filterAttributes:
      type: its.cam
