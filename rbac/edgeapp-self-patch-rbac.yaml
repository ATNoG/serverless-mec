apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edgeapp-self-patch
  namespace: default
rules:
- apiGroups: ["mec.atnog.org"]
  resources: ["edgeapplications"]
  resourceNames: ["cam-logger-operator"]   # lock it down to ONE CR
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edgeapp-self-patch
  namespace: default
subjects:
- kind: ServiceAccount
  name: cam-logger-sa
roleRef:
  kind: Role
  name: edgeapp-self-patch
  apiGroup: rbac.authorization.k8s.io
